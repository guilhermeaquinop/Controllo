<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0a0a0a}a:hover{color:#404040}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #0a0a0a;outline-offset:2px}
.sq{width:14px;height:14px;border-radius:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #0a0a0a; font-family: Montserrat, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; padding: 56px 24px 32px; gap: 32px;">
  <svg viewBox="0 0 612 112" width="186" height="34" role="img" aria-label="Controllo"><rect x="0" y="10.5" width="96" height="96" rx="26" fill="#0a0a0a"></rect><g fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"><path d="M38 56.5V80.5"></path><path d="M58 36.5V80.5"></path></g><g transform="translate(128 0)" fill="none" stroke="#0a0a0a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M46.62 59.88A23.5 23.5 0 1 0 46.62 93.12"></path><circle cx="100" cy="76.5" r="23.5"></circle><path d="M146.5 100V76.5A23.5 23.5 0 0 1 193.5 76.5V100"></path><path d="M222 24V100M211 53H236"></path><path d="M260.5 100V76.5A23.5 23.5 0 0 1 284 53"></path><circle cx="330" cy="76.5" r="23.5"></circle><path d="M378.5 34V100"></path><path d="M404.5 14V100"></path><circle cx="453" cy="76.5" r="23.5"></circle></g></svg>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em;">Seu dinheiro, dia a dia.</h1>
    <p style="margin: 0; color: #6b6b6b;">Entre para ver o saldo de cada dia e lançar o que entrou e saiu.</p>
  </div>

  <form aria-label="Entrar" style="display: flex; flex-direction: column; gap: 16px;">
    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 13px; font-weight: 600;">E-mail</span>
      <input type="email" autocomplete="email" placeholder="voce@email.com" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #8a8a8a; border-radius: 12px; font: inherit; color: #0a0a0a; background: #ffffff;">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 13px; font-weight: 600;">Senha</span></span>
      <span style="display: flex; align-items: center; height: 52px; box-sizing: border-box; border: 1px solid #8a8a8a; border-radius: 12px; padding: 0 4px 0 14px;">
        <input type="{{pwType}}" autocomplete="current-password" value="minhasenha" aria-label="Senha" style="flex: 1; min-width: 0; border: 0; font: inherit; color: #0a0a0a; background: transparent; outline-offset: 4px;">
        <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" aria-pressed="{{pwShown}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #0a0a0a; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </span>
    </label>
    <a href="#recuperar" style="align-self: flex-end; font-size: 13px; font-weight: 600; min-height: 32px; display: flex; align-items: center;">Esqueci minha senha</a>
    <a href="Main.dc.html" style="height: 52px; border-radius: 999px; background: #0a0a0a; color: #ffffff; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center;">Entrar</a>
  </form>

  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 20px;">
    <div style="display: flex; gap: 4px;" aria-hidden="true">
      <span class="sq" style="background: #5bab72;"></span><span class="sq" style="background: #a3dcae;"></span><span class="sq" style="background: #a3dcae;"></span><span class="sq" style="background: #f2d46b;"></span><span class="sq" style="background: #ec8b84;"></span><span class="sq" style="background: #f2d46b;"></span><span class="sq" style="background: #a3dcae;"></span><span class="sq" style="background: #5bab72;"></span><span class="sq" style="background: #5bab72;"></span><span class="sq" style="background: #a3dcae;"></span>
    </div>
    <p style="margin: 0; color: #6b6b6b;">Ainda não tem conta? <a href="#criar-conta" style="font-weight: 600;">Criar conta</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { shown: false }; }
  renderVals() {
    var self = this, s = this.state.shown;
    return { pwType: s ? 'text' : 'password', pwShown: s ? 'true' : 'false', pwLabel: s ? 'Ocultar senha' : 'Mostrar senha',
      togglePw: function () { self.setState({ shown: !s }); } };
  }
}
</script>
</body>
</html>
