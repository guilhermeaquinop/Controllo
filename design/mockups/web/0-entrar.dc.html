<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar · web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0a0a0a}a:hover{color:#404040}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #0a0a0a;outline-offset:2px}
.heat{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:4px;max-width:520px}
.h{aspect-ratio:1/1;border-radius:3px}
.z-neg{background:#a33a32}.z-red{background:#ec8b84}.z-yel{background:#f2d46b}.z-grn{background:#a3dcae}.z-dgr{background:#5bab72}.z-off{background:#262626}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; display: flex; flex-wrap: wrap; background: #ffffff; color: #0a0a0a; font-family: Montserrat, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5;">

  <section aria-label="Apresentação" style="flex: 1 1 520px; min-width: 0; box-sizing: border-box; background: #0a0a0a; color: #ffffff; padding: 48px clamp(24px, 5vw, 72px); display: flex; flex-direction: column; justify-content: space-between; gap: 48px;">
    <svg viewBox="0 0 612 112" width="186" height="34" role="img" aria-label="Controllo"><rect x="0" y="10.5" width="96" height="96" rx="26" fill="#ffffff"></rect><g fill="none" stroke="#0a0a0a" stroke-width="13" stroke-linecap="round"><path d="M38 56.5V80.5"></path><path d="M58 36.5V80.5"></path></g><g transform="translate(128 0)" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M46.62 59.88A23.5 23.5 0 1 0 46.62 93.12"></path><circle cx="100" cy="76.5" r="23.5"></circle><path d="M146.5 100V76.5A23.5 23.5 0 0 1 193.5 76.5V100"></path><path d="M222 24V100M211 53H236"></path><path d="M260.5 100V76.5A23.5 23.5 0 0 1 284 53"></path><circle cx="330" cy="76.5" r="23.5"></circle><path d="M378.5 34V100"></path><path d="M404.5 14V100"></path><circle cx="453" cy="76.5" r="23.5"></circle></g></svg>
    <div style="display: flex; flex-direction: column; gap: 28px;">
      <h1 style="margin: 0; font-size: clamp(32px, 3.4vw, 48px); line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; max-width: 14ch;">Seu dinheiro, dia a dia.</h1>
      <p style="margin: 0; color: #bdbdbd; font-size: 16px; max-width: 44ch;">Lance o que entrou e saiu, veja o saldo de cada dia mudar de cor e acompanhe quanto está guardando.</p>
      <div class="heat" role="img" aria-label="Exemplo de um ano visto dia a dia, cada quadrado colorido pela faixa do saldo">
        <sc-for list="{{heat}}" as="h" hint-placeholder-count="182"><span class="{{h}}"></span></sc-for>
      </div>
    </div>
    <span style="font-size: 12px; color: #9a9a9a;">Cada quadrado é um dia. A cor mostra a faixa do saldo.</span>
  </section>

  <section aria-label="Entrar" style="flex: 1 1 480px; min-width: 0; box-sizing: border-box; padding: 48px 24px; display: flex; align-items: center; justify-content: center;">
    <form style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h2 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700;">Entrar</h2>
        <p style="margin: 0; color: #6b6b6b;">Use o e-mail e a senha da sua conta.</p>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 13px; font-weight: 600;">E-mail</span>
        <input type="email" autocomplete="email" placeholder="voce@email.com" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #8a8a8a; border-radius: 12px; font: inherit; color: #0a0a0a; background: #ffffff;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 13px; font-weight: 600;">Senha</span>
        <span style="display: flex; align-items: center; height: 48px; box-sizing: border-box; border: 1px solid #8a8a8a; border-radius: 12px; padding: 0 2px 0 14px;">
          <input type="{{pwType}}" autocomplete="current-password" value="minhasenha" aria-label="Senha" style="flex: 1; min-width: 0; border: 0; font: inherit; color: #0a0a0a; background: transparent; outline-offset: 4px;">
          <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" aria-pressed="{{pwShown}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #0a0a0a; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </span>
      </label>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
        <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer;"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0a0a0a;"><span>Manter conectado</span></label>
        <a href="#recuperar" style="font-size: 13px; font-weight: 600;">Esqueci minha senha</a>
      </div>
      <a href="WebMes.dc.html" style="height: 48px; border-radius: 999px; background: #0a0a0a; color: #ffffff; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center;">Entrar</a>
      <p style="margin: 8px 0 0; color: #6b6b6b; text-align: center;">Ainda não tem conta? <a href="#criar-conta" style="font-weight: 600;">Criar conta</a></p>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { shown: false }; }
  renderVals() {
    var self = this, s = this.state.shown, seed = 11, heat = [], i, v = 2500;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    for (i = 0; i < 182; i++) {
      v += (rnd() - 0.5) * 900; if (i % 30 === 4) v += 2200; if (i % 30 === 10) v -= 1900;
      v = Math.max(-300, Math.min(6000, v));
      heat.push('h ' + (i > 168 ? 'z-off' : v < 0 ? 'z-neg' : v < 1000 ? 'z-red' : v < 2000 ? 'z-yel' : v < 4000 ? 'z-grn' : 'z-dgr'));
    }
    return { heat: heat, pwType: s ? 'text' : 'password', pwShown: s ? 'true' : 'false', pwLabel: s ? 'Ocultar senha' : 'Mostrar senha',
      togglePw: function () { self.setState({ shown: !s }); } };
  }
}
</script>
</body>
</html>
